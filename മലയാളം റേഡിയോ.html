<title>മലയാളം റേഡിയോ</title>
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14100c;--panel:#221a13;--panel2:#2c2218;--amber:#ffb23e;--amber2:#ff7a1a;--text:#f4e9d8;--mute:#a8957b;--line:#3a2d20;--wood:#4a2f1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 20% -10%,#3a2512 0,transparent 60%),var(--bg);color:var(--text);font-family:Manjari,"Noto Sans Malayalam",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
h1{margin:4px 0 14px;font-size:22px;letter-spacing:.3px;grid-column:1/-1;display:flex;align-items:center;gap:10px}
h1 small{font-family:Oswald,sans-serif;font-weight:400;color:var(--amber);letter-spacing:3px;font-size:12px;border:1px solid var(--amber);padding:2px 7px;border-radius:5px}
.radio{background:linear-gradient(160deg,var(--wood),#2a1a0e 70%);border-radius:26px;padding:18px;border:1px solid #6b4528;box-shadow:0 30px 60px #000a,inset 0 1px 0 #ffffff22;align-self:start;position:sticky;top:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.led{display:flex;align-items:center;gap:8px;font-family:Oswald,sans-serif;letter-spacing:2px;font-size:12px;color:var(--mute)}
.led i{width:10px;height:10px;border-radius:50%;background:#4a3a2a;box-shadow:inset 0 0 3px #000}
.on .led i{background:#ff3b30;box-shadow:0 0 10px #ff3b30;animation:blink 1.4s infinite}
.on .led{color:#ff8a80}
@keyframes blink{50%{opacity:.35}}
.display{background:linear-gradient(#1b1209,#0e0905);border-radius:16px;padding:14px 16px;border:2px solid #0008;box-shadow:inset 0 0 25px #000,0 0 0 1px #6b4528}
.name{font-size:24px;font-weight:700;color:var(--amber);text-shadow:0 0 14px #ff9a2e88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:34px}
.status{color:var(--mute);font-size:14px;min-height:20px}
.dial{position:relative;height:54px;margin-top:10px;border-top:1px solid #ffb23e44;background:repeating-linear-gradient(90deg,#ffb23e88 0 1px,transparent 1px 12px);-webkit-mask:linear-gradient(#000 0 40%,transparent 40%);mask:linear-gradient(#000 0 40%,transparent 40%)}
.dialwrap{position:relative;margin-top:6px}
.needle{position:absolute;top:-4px;bottom:0;width:2px;background:#ff3b30;box-shadow:0 0 8px #ff3b30;left:0;transition:left .6s cubic-bezier(.3,1.3,.5,1)}
.eq{display:flex;gap:4px;align-items:flex-end;height:34px;margin:12px 0 2px}
.eq b{flex:1;background:linear-gradient(var(--amber),var(--amber2));border-radius:2px;height:4px;opacity:.6;transition:height .3s}
.playing .eq b{animation:eq 1s ease-in-out infinite alternate;opacity:1}
@keyframes eq{to{height:100%}}
.grille{height:70px;margin:16px 0;border-radius:14px;background:radial-gradient(circle,#0009 1.6px,transparent 2px) 0 0/9px 9px,linear-gradient(#3a2614,#2a1a0e);border:1px solid #0006;box-shadow:inset 0 2px 10px #000a}
.ctrl{display:flex;align-items:center;justify-content:center;gap:16px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.rb{width:52px;height:52px;border-radius:50%;background:linear-gradient(#3b2b1c,#241a10);box-shadow:0 4px 10px #000a,inset 0 1px 0 #fff2;display:grid;place-items:center}
.rb:active{transform:scale(.94)}
.rb svg{width:22px;height:22px;fill:var(--text)}
.play{width:76px;height:76px;background:radial-gradient(circle at 30% 25%,#ffd27a,var(--amber2));box-shadow:0 0 28px #ff8a2a66,0 6px 14px #000a}
.play svg{width:32px;height:32px;fill:#2a1200}
.fav.act svg{fill:#ff5a7a}
.vol{display:flex;align-items:center;gap:10px;margin-top:18px;color:var(--mute)}
.vol svg{width:20px;height:20px;fill:var(--mute);flex:none}
input[type=range]{flex:1;accent-color:var(--amber);height:28px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;min-height:0}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:0}
.search:focus{border-color:var(--amber)}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{padding:7px 14px;border-radius:99px;background:var(--panel2);color:var(--mute);font-size:14px}
.tab.act{background:var(--amber);color:#2a1200;font-weight:700}
.items{overflow:auto;max-height:calc(100vh - 190px);min-height:300px;padding-right:2px}
@media(max-width:820px){.items{max-height:none}.radio{position:static}}
.it{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent}
.it:hover{background:var(--panel2)}
.it.cur{background:#3a2612;border-color:#ffb23e55}
.num{font-family:Oswald,sans-serif;color:var(--mute);width:26px;text-align:center;font-size:13px}
.ico{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--amber),var(--amber2));color:#2a1200;display:grid;place-items:center;font-family:Oswald,sans-serif;font-weight:600;flex:none}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{background:none;font-size:20px;color:#6b5a46;padding:4px 6px}
.hb.act{color:#ff5a7a}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.note{font-size:12px;color:var(--mute);margin-top:8px;text-align:center}
.tabs{overflow-x:auto;scrollbar-width:none}.tab{white-space:nowrap}
</style>
</head>

  else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(A);hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)nextUrl()})}
  else return nextUrl();
 }else{A.src=u}
 const p=A.play();if(p)p.catch(e=>{if(e.name!=="AbortError"&&e.name!=="NotAllowedError")nextUrl()});
}
function nextUrl(){if(!wantPlay)return;k++;tryUrl()}
function stationFail(){
 kill();fails++;
 if(wantPlay&&fails<6){setUI("load");status("ഈ സ്റ്റേഷൻ ലഭ്യമല്ല — അടുത്തതിലേക്ക്…");setTimeout(()=>{if(wantPlay)load(cur+1,true)},900)}
 else{wantPlay=false;setUI("err");status("കുറച്ച് സ്റ്റേഷനുകൾ ലഭ്യമല്ല. മറ്റൊന്ന് തിരഞ്ഞെടുക്കൂ ▶▶")}
}
function load(i,auto){
 if(!auto)fails=0;
 cur=((i%S.length)+S.length)%S.length;wantPlay=true;k=0;head();save();render();
 const row=document.querySelector(".it.cur");if(row)row.scrollIntoView({block:"nearest",behavior:"smooth"});
 setUI("load");status("ട്യൂൺ ചെയ്യുന്നു…");tryUrl();
}
function stop(){wantPlay=false;kill();A.pause();A.removeAttribute("src");A.load();setUI("idle");status("പോസ് ചെയ്തു")}
function toggle(){if(cur<0)cur=0;wantPlay?stop():load(cur)}
A.addEventListener("playing",()=>{clearTimeout(tm);fails=0;setUI("play");status("ലൈവ് • സ്ട്രീമിംഗ്")});
A.addEventListener("waiting",()=>{if(wantPlay){setUI("load");status("ബഫറിംഗ്…")}});
A.addEventListener("error",()=>{if(wantPlay&&A.getAttribute("src"))nextUrl()});
A.volume=.8;
$("vol").oninput=e=>A.volume=e.target.value;
$("play").onclick=toggle;
$("next").onclick=()=>load(cur+1);
$("prev").onclick=()=>load(cur-1);
$("rand").onclick=()=>load(Math.floor(Math.random()*S.length));
$("fav").onclick=()=>{if(cur<0)return;fav.has(cur)?fav.delete(cur):fav.add(cur);save();render()};
$("q").oninput=e=>{term=e.target.value;render()};
$("tabs").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;view=b.dataset.v;[...$("tabs").children].forEach(x=>x.classList.toggle("act",x===b));render()};
$("items").onclick=e=>{
 const f=e.target.closest("[data-f]");
 if(f){const i=+f.dataset.f;fav.has(i)?fav.delete(i):fav.add(i);save();render();return}
 const r=e.target.closest(".it");if(r)load(+r.dataset.i);
};
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT"&&e.target.type!=="range")return;
 if(e.code==="Space"){e.preventDefault();toggle()}
 else if(e.code==="ArrowRight")load(cur+1);
 else if(e.code==="ArrowLeft")load(cur-1);
});
if("mediaSession"in navigator){
 navigator.mediaSession.setActionHandler("play",()=>load(cur<0?0:cur));
 navigator.mediaSession.setActionHandler("pause",stop);
 navigator.mediaSession.setActionHandler("nexttrack",()=>load(cur+1));
 navigator.mediaSession.setActionHandler("previoustrack",()=>load(cur-1));
}
head();render();
</script>
</body>
</html>
