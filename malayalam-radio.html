<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<title>മലയാളം റേഡിയോ</title>
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14100c;--panel:#221a13;--panel2:#2c2218;--amber:#ffb23e;--amber2:#ff7a1a;--text:#f4e9d8;--mute:#a8957b;--line:#3a2d20;--wood:#4a2f1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 20% -10%,#3a2512 0,transparent 60%),var(--bg);color:var(--text);font-family:Manjari,"Noto Sans Malayalam",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
h1{margin:4px 0 14px;font-size:22px;letter-spacing:.3px;grid-column:1/-1;display:flex;align-items:center;gap:10px}
h1 small{font-family:Oswald,sans-serif;font-weight:400;color:var(--amber);letter-spacing:3px;font-size:12px;border:1px solid var(--amber);padding:2px 7px;border-radius:5px}
.radio{background:linear-gradient(160deg,var(--wood),#2a1a0e 70%);border-radius:26px;padding:18px;border:1px solid #6b4528;box-shadow:0 30px 60px #000a,inset 0 1px 0 #ffffff22;align-self:start;position:sticky;top:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.led{display:flex;align-items:center;gap:8px;font-family:Oswald,sans-serif;letter-spacing:2px;font-size:12px;color:var(--mute)}
.led i{width:10px;height:10px;border-radius:50%;background:#4a3a2a;box-shadow:inset 0 0 3px #000}
.on .led i{background:#ff3b30;box-shadow:0 0 10px #ff3b30;animation:blink 1.4s infinite}
.on .led{color:#ff8a80}
@keyframes blink{50%{opacity:.35}}
.display{background:linear-gradient(#1b1209,#0e0905);border-radius:16px;padding:14px 16px;border:2px solid #0008;box-shadow:inset 0 0 25px #000,0 0 0 1px #6b4528}
.name{font-size:24px;font-weight:700;color:var(--amber);text-shadow:0 0 14px #ff9a2e88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:34px}
.status{color:var(--mute);font-size:14px;min-height:20px}
.dial{position:relative;height:54px;margin-top:10px;border-top:1px solid #ffb23e44;background:repeating-linear-gradient(90deg,#ffb23e88 0 1px,transparent 1px 12px);-webkit-mask:linear-gradient(#000 0 40%,transparent 40%);mask:linear-gradient(#000 0 40%,transparent 40%)}
.dialwrap{position:relative;margin-top:6px}
.needle{position:absolute;top:-4px;bottom:0;width:2px;background:#ff3b30;box-shadow:0 0 8px #ff3b30;left:0;transition:left .6s cubic-bezier(.3,1.3,.5,1)}
.eq{display:flex;gap:4px;align-items:flex-end;height:34px;margin:12px 0 2px}
.eq b{flex:1;background:linear-gradient(var(--amber),var(--amber2));border-radius:2px;height:4px;opacity:.6;transition:height .3s}
.playing .eq b{animation:eq 1s ease-in-out infinite alternate;opacity:1}
@keyframes eq{to{height:100%}}
.grille{height:70px;margin:16px 0;border-radius:14px;background:radial-gradient(circle,#0009 1.6px,transparent 2px) 0 0/9px 9px,linear-gradient(#3a2614,#2a1a0e);border:1px solid #0006;box-shadow:inset 0 2px 10px #000a}
.ctrl{display:flex;align-items:center;justify-content:center;gap:16px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.rb{width:52px;height:52px;border-radius:50%;background:linear-gradient(#3b2b1c,#241a10);box-shadow:0 4px 10px #000a,inset 0 1px 0 #fff2;display:grid;place-items:center}
.rb:active{transform:scale(.94)}
.rb svg{width:22px;height:22px;fill:var(--text)}
.play{width:76px;height:76px;background:radial-gradient(circle at 30% 25%,#ffd27a,var(--amber2));box-shadow:0 0 28px #ff8a2a66,0 6px 14px #000a}
.play svg{width:32px;height:32px;fill:#2a1200}
.fav.act svg{fill:#ff5a7a}
.vol{display:flex;align-items:center;gap:10px;margin-top:18px;color:var(--mute)}
.vol svg{width:20px;height:20px;fill:var(--mute);flex:none}
input[type=range]{flex:1;accent-color:var(--amber);height:28px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;min-height:0}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:0}
.search:focus{border-color:var(--amber)}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{padding:7px 14px;border-radius:99px;background:var(--panel2);color:var(--mute);font-size:14px}
.tab.act{background:var(--amber);color:#2a1200;font-weight:700}
.items{overflow:auto;max-height:calc(100vh - 190px);min-height:300px;padding-right:2px}
@media(max-width:820px){.items{max-height:none}.radio{position:static}}
.it{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent}
.it:hover{background:var(--panel2)}
.it.cur{background:#3a2612;border-color:#ffb23e55}
.num{font-family:Oswald,sans-serif;color:var(--mute);width:26px;text-align:center;font-size:13px}
.ico{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--amber),var(--amber2));color:#2a1200;display:grid;place-items:center;font-family:Oswald,sans-serif;font-weight:600;flex:none}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{background:none;font-size:20px;color:#6b5a46;padding:4px 6px}
.hb.act{color:#ff5a7a}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.note{font-size:12px;color:var(--mute);margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="app">
<h1>📻 മലയാളം റേഡിയോ <small>LIVE</small></h1>

<section class="radio" id="radio">
 <div class="top"><div class="led"><i></i><span id="onair">STANDBY</span></div><div class="led" id="cnt"></div></div>
 <div class="display">
  <div class="name" id="name">ഒരു സ്റ്റേഷൻ തിരഞ്ഞെടുക്കൂ</div>
  <div class="status" id="status">പ്ലേ ചെയ്യാൻ ▶ അമർത്തുക</div>
  <div class="dialwrap"><div class="dial"></div><div class="needle" id="needle"></div></div>
  <div class="eq" id="eq"></div>
 </div>
 <div class="grille"></div>
 <div class="ctrl">
  <button class="rb fav" id="fav" aria-label="പ്രിയപ്പെട്ടത്"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.8 5 6.2 5c2 0 3.2 1 3.8 2 .6-1 1.8-2 3.8-2 3.400 0 5.200 3.600 3.800 6.800C19.500 16.400 12 21 12 21z"/></svg></button>
  <button class="rb" id="prev" aria-label="മുമ്പത്തേത്"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.500 12 18 18V6z"/></svg></button>
  <button class="rb play" id="play" aria-label="പ്ലേ"><svg viewBox="0 0 24 24" id="pi"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="rb" id="next" aria-label="അടുത്തത്"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.500-6L6 6z"/></svg></button>
  <button class="rb" id="rand" aria-label="ഷഫിൾ"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.500-1.500L5.400 19.600 4 18.200 18.100 4.100zM4 5.800 5.400 4.400 10 9 8.600 10.400zM14.200 13.600l1.400-1.400 4.400 4.400L21 21h-4l1.500-1.500z"/></svg></button>
 </div>
 <div class="vol"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.500 3A4.500 4.500 0 0 0 14 8v8a4.500 4.500 0 0 0 2.500-4z"/></svg><input type="range" id="vol" min="0" max="1" step=".01" value=".8"></div>
</section>

<section class="list">
 <input class="search" id="q" placeholder="സ്റ്റേഷൻ തിരയുക…" autocomplete="off">
 <div class="tabs"><button class="tab act" id="tAll">എല്ലാം</button><button class="tab" id="tFav">♥ പ്രിയപ്പെട്ടവ</button></div>
 <div class="items" id="items"></div>
 <div class="note">സ്പേസ് = പ്ലേ/പോസ് · ← → = സ്റ്റേഷൻ മാറ്റം</div>
</section>
</div>

<script>
const S=[["AIR Kozhikode Real 103.6 FM","http://185.193.112.155:18454/;"],["Radio Media Village","http://184.154.43.106:8145/;"],["Malayalam Hits","http://212.83.138.48:8052/stream?type=http&nocache=42"],["Theeram Radio","http://titan.shoutca.st:8647/stream"],["LMR Radio","https://listen.shoutcast.com/radiolmr"],["Radio Suno","http://20103.live.streamtheworld.com/SUNO917.mp3"],["Hit Classics","http://19393.live.streamtheworld.com/HIT_CLASSICSAAC_SC"],["Radio Graamam","http://usa1.fastcast4u.com/proxy/radiogra?mp=/1"],["Njan Malayalee Radio","http://78.129.224.11:8754/stream.mp3"],["Mazhavil FM","http://mazhavilfm.out.airtime.pro:8000/mazhavilfm_a"],["Shalom Radio","http://stream.radio.co/s1383afdc9/listen?ver=828256"],["Ganam Radio","http://5.79.88.132:7104/;"],["Flowers FM Radio","http://50.7.99.163:16098/stream?type=http&nocache=2"],["Oman Malayalam","http://94.23.36.180:5022/stream?type=http&nocache=974"],["Radio Maharani","http://audiocp.globaliway.co.in:7235/start/maharani/;stream.mp3"],["Luminous Radio","http://192.111.140.6:8546/stream"],["Radio Ayyappa","http://s35.myradiostream.com:28232/;"],["Radio Maria","http://dreamsiteradiocp.com:8002/;"],["TCR Live Radio","http://163.172.7.166:8108/;"],["Gloria Radio","http://viadj.viastreaming.net:7233/;listen.mp3"],["Mohanlal Hits","http://192.227.116.104:4160/autodj"],["Radio Onattukara","http://streaming.shoutcast.com/RadioOnattukara"],["Radio City","http://prclive1.listenon.in:9908/;"],["Radio Mango 91.9 FM","http://51.15.208.163:8081/radio/RadioMango_1/icecast.audio"],["Radio Angelos","http://s7.voscast.com:9562/;stream/1;"],["Radio Malabar","http://s4.voscast.com:8068/;"],["Dharma Radio","http://s12.myradiostream.com:6004/;"],["98.6 FM","http://vokcast.bluecast.in:8227/986fm"],["Ephphatha Radio","http://144.217.195.24:8605/;stream.mp3"],["Shalom Beats Radio","http://rd.shalombeatsradio.com:8006/stream"],["Radio Kerala","http://radio.hostonnet.com:8000/;stream.mp3"],["Radio Asia","http://50.7.71.27:9699/;stream.mp3"],["AR Radio","http://185.193.112.155:18076/;"],["Kuwait 1 FM","http://192.240.102.198:14349/stream?type=http&nocache=2"],["Malayali Radio","http://91.121.164.210:8464/;"],["Sehion Radio","http://199.195.194.140:8012/stream"],["The Stars of Kerala Radio","http://144.217.129.213:9202/stream"],["AIR Manjeri FM","http://185.193.112.155:18146/;"],["Mappila Songs Radio","http://109.169.26.216:9000/;stream.mp3"],["Radio Kairali","http://185.193.112.155:18344/;stream.mp3"],["Orthodox Radio","http://orthodoxradio.radioca.st/stream"],["Radio Manna","http://216.224.164.193:7084/;"],["Pravasi Malayali Radio","http://99.198.118.250:8044/stream"],["Ananthapuri FM","http://59.90.28.91:88/broadwavehigh.mp3?src=1"],["Gosree Radio","http://188.40.135.197:8404/stream?type=http&nocache=38617"],["Radio City Malayalam Gold","http://prclive1.listenon.in:9940/;"],["Ente Radio","http://stream1.corehub.org:8000/enteradio1"],["Life Light Radio","http://178.32.62.154:8548/stream"],["Green Radio","http://37.59.32.115:5139/;"],["Hello Radio","http://132.148.128.197:8000/helloradio.ogg"],["R4 Radio","http://r4radio.com:8000/live"],["Tanalur Radio","http://163.172.7.166:8090/stream"],["Paattupetti Radio","https://streamer.radio.co/sa3813647a/listen"],["AIR World Service","http://radio.mediaisyou.com/live5.mp3"],["Radio Heart Beats","http://64.150.176.9:8272/live"],["Radio Mirchi Bahrain","http://162.244.80.118:4055/stream?type=http&nocache=10121"],["Radio Macfast 90.4 FM","http://87.117.208.118:6385/stream"],["Naadan Radio","http://viadj.viastreaming.net:7070/;"],["Global Radio","http://streamasiacdn.atc-labs.com/globalradio.aac"],["KJ Yesudas Hits","http://prclive1.listenon.in:8824/;"],["7 Eyes Radio","http://37.59.32.115:5216/;"],["Wish FM Radio","http://185.193.112.155:18060/;"],["Ente Lokam Radio","http://s10.voscast.com:8530/;"],["Radio Malayalam USA","http://167.114.131.90:5412/stream3"],["Ragam Radio","http://178.32.107.151:5116/stream"],["Psalms Radio","http://viadj.viastreaming.net:7084/;stream.mp3"],["Patturumal Radio","http://51.15.152.81:8535//;stream.mp3"],["Radio Santa Monica","http://192.99.35.93:16136/stream?type=http&nocache=3994"],["Radio Live 24x7","http://streams.radio.co/s500f86cc3/listen"],["Bafa Radio","http://198.245.60.88:8300/stream"],["Radio Mattoli","http://87.117.205.22:8066/stream"],["Rafa Radio","http://37.59.47.192:8596/stream"],["Hit FM","http://18003.live.streamtheworld.com/HIT_SC"],["Majix Radio","http://162.244.80.118:6870/stream?type=http&nocache=1549"],["Chitra Hits","http://192.227.116.104:4262/autodj"],["All India Radio Malayalam","http://51.15.208.163:8081/radio/airmalayalam/icecast.audio"],["Radio Benziger Kollam","http://158.69.202.192:9302/;"],["Peace Radio","http://stream.peaceradio.com:8000/high"],["Malayali FM","https://streaming.radio.co/sd6cafcd5b/listen"],["Hungama Malayalam","http://103.16.47.70:9111/listenpls"],["KNP Infotech Radio","http://radio.knpinfotech.co.in:8000/;"],["Radio Delhi","http://hyades.shoutca.st:8667/;stream.mp3"],["Asianet Radio","http://icast01.bluecast.in:8227/657am"],["Club FM 94.3","http://playerservices.streamtheworld.com/api/livestream-redirect/CLUBFMUAEAAC.aac"],["Pravasi Bharathi 810 AM","http://198.27.67.39:8000/pravasiradio.mp3"]];
const $=id=>document.getElementById(id),A=new Audio();A.preload="none";
let cur=-1,view="all",term="",wantPlay=false,fav=new Set();
try{fav=new Set(JSON.parse(localStorage.getItem("mr_fav")||"[]"))}catch(e){}
try{const l=parseInt(localStorage.getItem("mr_last"));if(l>=0&&l<S.length)cur=l}catch(e){}
$("eq").innerHTML="<b></b>".repeat(28);
[...$("eq").children].forEach((b,i)=>{b.style.animationDelay=(-Math.random()).toFixed(2)+"s";b.style.animationDuration=(.5+Math.random()*.8).toFixed(2)+"s"});
$("cnt").textContent=S.length+" STATIONS";
const PL="M8 5v14l11-7z",PA="M6 5h4v14H6zM14 5h4v14h-4z";
const R=$("radio");
function status(t){$("status").textContent=t}
function setUI(st){R.classList.toggle("on",st!=="idle");R.classList.toggle("playing",st==="play");$("pi").innerHTML='<path d="'+(st==="idle"||st==="err"?PL:PA)+'"/>';$("onair").textContent=st==="play"?"ON AIR":st==="load"?"TUNING":"STANDBY"}
function save(){try{localStorage.setItem("mr_fav",JSON.stringify([...fav]));localStorage.setItem("mr_last",cur)}catch(e){}}
function render(){
 const t=term.toLowerCase(),el=$("items");let h="";
 S.forEach((s,i)=>{
  if(view==="fav"&&!fav.has(i))return;
  if(t&&!s[0].toLowerCase().includes(t))return;
  h+=`<div class="it${i===cur?" cur":""}" data-i="${i}"><span class="num">${i+1}</span><span class="ico">${s[0].trim()[0].toUpperCase()}</span><span class="t">${s[0]}</span><button class="hb${fav.has(i)?" act":""}" data-f="${i}" aria-label="പ്രിയപ്പെട്ടത്">${fav.has(i)?"♥":"♡"}</button></div>`});
 el.innerHTML=h||'<div class="empty">'+(view==="fav"?"പ്രിയപ്പെട്ട സ്റ്റേഷനുകൾ ഒന്നുമില്ല. ♡ അമർത്തി ചേർക്കൂ.":"ഒന്നും കണ്ടെത്തിയില്ല")+"</div>";
 $("fav").classList.toggle("act",fav.has(cur));
}
function head(){
 if(cur<0)return;
 $("name").textContent=S[cur][0];
 $("needle").style.left=(S.length>1?cur/(S.length-1)*100:0)+"%";
 if("mediaSession"in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:S[cur][0],artist:"മലയാളം റേഡിയോ — Live"})}
}
function load(i){
 cur=((i%S.length)+S.length)%S.length;wantPlay=true;head();save();render();
 const row=document.querySelector(".it.cur");if(row)row.scrollIntoView({block:"nearest",behavior:"smooth"});
 setUI("load");status("ട്യൂൺ ചെയ്യുന്നു…");
 A.src=S[cur][1];A.load();
 const p=A.play();if(p)p.catch(e=>{if(e.name!=="AbortError"){setUI("err");status("പ്ലേ ചെയ്യാനായില്ല. അടുത്ത സ്റ്റേഷൻ ശ്രമിക്കൂ ▶▶")}});
}
function stop(){wantPlay=false;A.pause();A.removeAttribute("src");A.load();setUI("idle");status("പോസ് ചെയ്തു")}
function toggle(){if(cur<0)cur=0;if(wantPlay)stop();else load(cur)}
A.addEventListener("playing",()=>{setUI("play");status("ലൈവ് • സ്ട്രീമിംഗ്")});
A.addEventListener("waiting",()=>{if(wantPlay){setUI("load");status("ബഫറിംഗ്…")}});
A.addEventListener("error",()=>{if(!wantPlay||!A.src)return;wantPlay=true;setUI("err");R.classList.remove("on");status("ഈ സ്റ്റേഷൻ ഇപ്പോൾ ലഭ്യമല്ല. അടുത്തത് ശ്രമിക്കൂ ▶▶")});
A.volume=.8;
$("vol").oninput=e=>A.volume=e.target.value;
$("play").onclick=toggle;
$("next").onclick=()=>load(cur+1);
$("prev").onclick=()=>load(cur-1);
$("rand").onclick=()=>load(Math.floor(Math.random()*S.length));
$("fav").onclick=()=>{if(cur<0)return;fav.has(cur)?fav.delete(cur):fav.add(cur);save();render()};
$("q").oninput=e=>{term=e.target.value;render()};
$("tAll").onclick=()=>{view="all";$("tAll").classList.add("act");$("tFav").classList.remove("act");render()};
$("tFav").onclick=()=>{view="fav";$("tFav").classList.add("act");$("tAll").classList.remove("act");render()};
$("items").onclick=e=>{
 const f=e.target.closest("[data-f]");
 if(f){const i=+f.dataset.f;fav.has(i)?fav.delete(i):fav.add(i);save();render();return}
 const r=e.target.closest(".it");if(r)load(+r.dataset.i);
};
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT"&&e.target.type!=="range")return;
 if(e.code==="Space"){e.preventDefault();toggle()}
 else if(e.code==="ArrowRight")load(cur+1);
 else if(e.code==="ArrowLeft")load(cur-1);
});
if("mediaSession"in navigator){
 navigator.mediaSession.setActionHandler("play",()=>load(cur<0?0:cur));
 navigator.mediaSession.setActionHandler("pause",stop);
 navigator.mediaSession.setActionHandler("nexttrack",()=>load(cur+1));
 navigator.mediaSession.setActionHandler("previoustrack",()=>load(cur-1));
}
head();render();
</script>
</body>
</html>
